<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B" />
      <stop offset="50%" stop-color="#080E21" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="glow2" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>
    <filter id="neon2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#bg2)" />
  <rect width="600" height="380" fill="url(#glow2)" />

  <!-- Subtle Blueprint Grid -->
  <g stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4">
    <line x1="0" y1="95" x2="600" y2="95" />
    <line x1="0" y1="190" x2="600" y2="190" />
    <line x1="0" y1="285" x2="600" y2="285" />
    <line x1="150" y1="0" x2="150" y2="380" />
    <line x1="300" y1="0" x2="300" y2="380" />
    <line x1="450" y1="0" x2="450" y2="380" />
  </g>

  <!-- Mobile Device Chassis (Floating Perspective Mockup) -->
  <g transform="translate(195, 20)">
    <!-- Phone Shadow -->
    <rect x="6" y="8" width="210" height="340" rx="34" fill="#000000" opacity="0.6" filter="blur(10px)" />
    <!-- Phone Border / Chassis -->
    <rect x="0" y="0" width="210" height="340" rx="34" fill="#0F172A" stroke="#334155" stroke-width="2.5" />
    <!-- Phone Screen Glass -->
    <rect x="6" y="6" width="198" height="328" rx="28" fill="#020617" />

    <!-- Dynamic Island -->
    <rect x="68" y="14" width="62" height="15" rx="7.5" fill="#000000" stroke="#1E293B" stroke-width="0.75" />
    <circle cx="118" cy="21.5" r="3" fill="#0EA5E9" opacity="0.9" />

    <!-- Status Bar -->
    <text x="24" y="25" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">9:41</text>
    <g transform="translate(160, 18)" stroke="#94A3B8" stroke-width="1.2" fill="none">
      <path d="M0,7 A5,5 0 0,1 10,7 M2,5 A3,3 0 0,1 8,5 M4,3 A1,1 0 0,1 6,3" />
      <rect x="14" y="1" width="12" height="6.5" rx="1.5" />
      <rect x="15.5" y="2.5" width="7" height="3.5" rx="0.75" fill="#94A3B8" />
    </g>

    <!-- App Header -->
    <g transform="translate(16, 42)">
      <text x="0" y="14" fill="#F8FAFC" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Aura Pulse</text>
      <rect x="110" y="2" width="56" height="16" rx="8" fill="#0369A1" fill-opacity="0.3" stroke="#0284C7" stroke-width="0.8" />
      <circle cx="118" cy="10" r="2.5" fill="#10B981" />
      <text x="124" y="12" fill="#38BDF8" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8" font-weight="600">SYNCED</text>
    </g>

    <!-- Heart Rate Telemetry Card -->
    <g transform="translate(16, 72)">
      <rect x="0" y="0" width="166" height="88" rx="14" fill="url(#cardGrad2)" stroke="#1E293B" stroke-width="1" />
      <text x="12" y="20" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500">HEART RATE · RESTING</text>
      
      <text x="12" y="46" fill="#F8FAFC" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">138</text>
      <text x="64" y="45" fill="#F43F5E" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700">BPM</text>
      
      <rect x="112" y="12" width="42" height="15" rx="7.5" fill="#10B981" fill-opacity="0.2" />
      <text x="118" y="22" fill="#34D399" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600">Optimal</text>

      <!-- Pulse Waveform -->
      <path d="M12,70 L40,70 L48,58 L54,78 L62,50 L70,82 L76,64 L82,70 L154,70" fill="none" stroke="#F43F5E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon2)" />
    </g>

    <!-- Biometric Strain &amp; Recovery Rings -->
    <g transform="translate(16, 170)">
      <rect x="0" y="0" width="166" height="74" rx="14" fill="url(#cardGrad2)" stroke="#1E293B" stroke-width="1" />
      
      <!-- Circular Progress Ring -->
      <circle cx="38" cy="37" r="24" fill="none" stroke="#1E293B" stroke-width="5" />
      <circle cx="38" cy="37" r="24" fill="none" stroke="#06B6D4" stroke-width="5" stroke-dasharray="150" stroke-dashoffset="38" stroke-linecap="round" />
      <text x="38" y="41" text-anchor="middle" fill="#FFFFFF" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700">94%</text>

      <!-- Metrics Label -->
      <text x="74" y="26" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600">RECOVERY SCORE</text>
      <text x="74" y="42" fill="#E2E8F0" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">High Readiness</text>
      <text x="74" y="58" fill="#38BDF8" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5">+14% vs 7-day baseline</text>
    </g>

    <!-- Daily Target Badges -->
    <g transform="translate(16, 254)">
      <rect x="0" y="0" width="80" height="42" rx="10" fill="#0F172A" stroke="#1E293B" />
      <text x="8" y="16" fill="#64748B" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">CALORIES</text>
      <text x="8" y="32" fill="#38BDF8" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">840 kcal</text>

      <rect x="86" y="0" width="80" height="42" rx="10" fill="#0F172A" stroke="#1E293B" />
      <text x="94" y="16" fill="#64748B" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8">ACTIVITY</text>
      <text x="94" y="32" fill="#10B981" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">68 mins</text>
    </g>

    <!-- Home Indicator -->
    <rect x="68" y="318" width="62" height="3.5" rx="2" fill="#64748B" opacity="0.6" />
  </g>

  <!-- Left Side Badges / Spec Annotations -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="145" height="52" rx="10" fill="#0F172A" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="26" r="5" fill="#0284C7" />
    <text x="28" y="22" fill="#F8FAFC" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Flutter 3.24 Engine</text>
    <text x="28" y="38" fill="#38BDF8" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9">Locked 60 FPS Custom Canvas</text>
  </g>

  <g transform="translate(30, 146)">
    <rect x="0" y="0" width="145" height="52" rx="10" fill="#0F172A" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="26" r="5" fill="#10B981" />
    <text x="28" y="22" fill="#F8FAFC" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Apple HealthKit</text>
    <text x="28" y="38" fill="#34D399" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9">Bi-Directional SQLite Sync</text>
  </g>

  <!-- Right Side Badges / Spec Annotations -->
  <g transform="translate(425, 80)">
    <rect x="0" y="0" width="145" height="52" rx="10" fill="#0F172A" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <text x="12" y="22" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">APP STORE METRIC</text>
    <text x="12" y="40" fill="#F8FAFC" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700">4.9 ★ · 48k+ DAU</text>
  </g>

  <g transform="translate(425, 146)">
    <rect x="0" y="0" width="145" height="52" rx="10" fill="#0F172A" fill-opacity="0.85" stroke="#334155" stroke-width="1" />
    <text x="12" y="22" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">STATE ARCHITECTURE</text>
    <text x="12" y="40" fill="#38BDF8" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700">BLoC + Clean Arch</text>
  </g>
</svg>