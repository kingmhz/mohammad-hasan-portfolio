<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C16" />
      <stop offset="60%" stop-color="#04070D" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <radialGradient id="aeroGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="600" height="380" fill="url(#bg9)" />
  <rect width="600" height="380" fill="url(#aeroGlow)" />

  <!-- Studio Lighting &amp; Horizon Lines -->
  <g stroke="#1E293B" stroke-width="0.7">
    <line x1="0" y1="260" x2="600" y2="260" stroke="#334155" stroke-width="1.2" />
    <ellipse cx="300" cy="265" rx="240" ry="40" fill="none" stroke="#1E293B" />
  </g>

  <!-- Aerodynamic Hypercar Silhouette Outline -->
  <g transform="translate(130, 150)">
    <!-- Aerodynamic Wind Flow Lines -->
    <path d="M-60,30 C40,-10 140,-15 280,10 T380,30" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.8" />
    <path d="M-40,60 C60,40 160,35 300,55" fill="none" stroke="#0284C7" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.6" />

    <!-- Car Body Shape (Low-slung Coupe Hypercar Profile) -->
    <path d="M-10,75 C20,70 60,65 90,40 C120,20 180,18 230,38 C260,50 300,68 330,75 L330,85 C290,85 280,95 260,95 C240,95 230,85 100,85 C90,85 80,95 60,95 C40,95 30,85 -10,85 Z" fill="#0F172A" stroke="#38BDF8" stroke-width="2" />
    
    <!-- Wheels -->
    <circle cx="50" cy="85" r="22" fill="#020617" stroke="#64748B" stroke-width="3" />
    <circle cx="50" cy="85" r="14" fill="#1E293B" stroke="#0284C7" stroke-width="1.5" />

    <circle cx="270" cy="85" r="22" fill="#020617" stroke="#64748B" stroke-width="3" />
    <circle cx="270" cy="85" r="14" fill="#1E293B" stroke="#0284C7" stroke-width="1.5" />

    <!-- Cockpit Glass &amp; Reflection -->
    <path d="M105,42 C125,26 175,24 215,40 Z" fill="#38BDF8" fill-opacity="0.25" stroke="#38BDF8" stroke-width="1" />
  </g>

  <!-- Top Studio Configurator Bar -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="550" height="34" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="17" r="3.5" fill="#10B981" />
    <text x="28" y="21" fill="#F8FAFC" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700">VELOCE 3D STUDIO :: GLSL RAYMARCHING CONFIGURATOR</text>
    <text x="440" y="21" fill="#38BDF8" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="600">60.0 FPS LOCKED</text>
  </g>

  <!-- Bottom Left: Aero Telemetry -->
  <g transform="translate(25, 240)">
    <rect x="0" y="0" width="220" height="105" rx="10" fill="#0B1120" stroke="#1E293B" stroke-width="1" />
    <text x="14" y="22" fill="#64748B" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" font-weight="700">AERODYNAMIC DOWNFORCE</text>
    <text x="14" y="46" fill="#F8FAFC" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" font-weight="700">780 kg <tspan fill="#38BDF8" font-size="10">@ 250 km/h</tspan></text>
    <text x="14" y="68" fill="#94A3B8" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9">Drag Coefficient: Cd 0.31</text>
    <text x="14" y="86" fill="#10B981" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9">Active Rear Wing: DEPLOYED</text>
  </g>

  <!-- Bottom Right: PBR Material Swatches -->
  <g transform="translate(355, 240)">
    <rect x="0" y="0" width="220" height="105" rx="10" fill="#0B1120" stroke="#1E293B" stroke-width="1" />
    <text x="14" y="22" fill="#64748B" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" font-weight="700">CARBON-WEAVE PBR SHADER</text>
    
    <g transform="translate(14, 36)">
      <circle cx="14" cy="14" r="14" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5" />
      <circle cx="52" cy="14" r="14" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
      <circle cx="90" cy="14" r="14" fill="#DC2626" stroke="#F87171" stroke-width="1.5" />
      <circle cx="128" cy="14" r="14" fill="#D97706" stroke="#FCD34D" stroke-width="1.5" />
    </g>
    <text x="14" y="86" fill="#38BDF8" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9">Instant GLTF 3D Spec Gen</text>
  </g>
</svg>