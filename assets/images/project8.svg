<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E1A" />
      <stop offset="50%" stop-color="#050912" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#bg8)" />

  <!-- Vector Map Grid &amp; Roads -->
  <g stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.5">
    <path d="M0,120 Q180,90 320,160 T600,140" fill="none" stroke="#334155" stroke-width="2" />
    <path d="M80,380 Q240,240 380,260 T600,220" fill="none" stroke="#1E293B" stroke-width="2" />
    <line x1="200" y1="0" x2="280" y2="380" stroke="#1E293B" stroke-width="1.5" />
    <line x1="420" y1="0" x2="360" y2="380" stroke="#1E293B" stroke-width="1.5" />
  </g>

  <!-- Active Route Path with Glow -->
  <path d="M70,280 C180,220 250,110 480,100" fill="none" stroke="#0284C7" stroke-width="3.5" stroke-linecap="round" />
  <path d="M70,280 C180,220 250,110 480,100" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="6,4" />

  <!-- Waypoint Origin -->
  <circle cx="70" cy="280" r="7" fill="#0284C7" />
  <circle cx="70" cy="280" r="3" fill="#FFFFFF" />
  <text x="84" y="284" fill="#F8FAFC" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700">ROTTERDAM HUB</text>

  <!-- Waypoint Destination -->
  <circle cx="480" cy="100" r="7" fill="#10B981" />
  <circle cx="480" cy="100" r="3" fill="#FFFFFF" />
  <text x="495" y="104" fill="#F8FAFC" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700">MILAN TERMINAL</text>

  <!-- Live Vehicle In-Transit Marker -->
  <g transform="translate(235, 160)">
    <circle cx="0" cy="0" r="14" fill="#0284C7" fill-opacity="0.3" />
    <circle cx="0" cy="0" r="6" fill="#38BDF8" />
    <rect x="15" y="-18" width="120" height="36" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <text x="24" y="-4" fill="#F8FAFC" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" font-weight="700">FLEET #408 [LIVE]</text>
    <text x="24" y="9" fill="#10B981" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8">Temp: -18.2°C (Optimal)</text>
  </g>

  <!-- Top Dispatch Stats Bar -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="550" height="34" rx="8" fill="#0F172A" fill-opacity="0.9" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="17" r="3.5" fill="#10B981" />
    <text x="28" y="21" fill="#F8FAFC" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700">CHRONOS FLEET DISPATCH :: MAPBOX GL ENGINE</text>
    <text x="390" y="21" fill="#38BDF8" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="600">12,000+ VEHICLES TRACKED</text>
  </g>

  <!-- Bottom Right Telemetry Box -->
  <g transform="translate(340, 240)">
    <rect x="0" y="0" width="235" height="105" rx="10" fill="#0B1120" stroke="#1E293B" stroke-width="1" />
    <text x="14" y="22" fill="#64748B" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" font-weight="700">COLD-CHAIN ROUTE METRIC</text>
    <text x="14" y="44" fill="#34D399" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="700">-18.4% Transit Fuel</text>
    <text x="14" y="64" fill="#94A3B8" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9">Dynamic Traffic Rerouting</text>
    <text x="14" y="82" fill="#38BDF8" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9">Driver Offline SQLite Sync</text>
  </g>
</svg>