<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
    <defs>
      <linearGradient id="bg_project3.svg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" />
        <stop offset="100%" stop-color="#F1F5F9" />
      </linearGradient>
      <radialGradient id="glow_project3.svg" cx="80%" cy="20%" r="60%">
        <stop offset="0%" stop-color="#0284C7" stop-opacity="0.12" />
        <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
      </radialGradient>
    </defs>
    <rect width="600" height="380" fill="url(#bg_project3.svg)" />
    <rect width="600" height="380" fill="url(#glow_project3.svg)" />
    
    <!-- Fine Grid Lines -->
    <g stroke="rgba(2,132,199,0.06)" stroke-width="1">
      <line x1="0" y1="95" x2="600" y2="95" />
      <line x1="0" y1="190" x2="600" y2="190" />
      <line x1="0" y1="285" x2="600" y2="285" />
      <line x1="150" y1="0" x2="150" y2="380" />
      <line x1="300" y1="0" x2="300" y2="380" />
      <line x1="450" y1="0" x2="450" y2="380" />
    </g>

    <!-- Header Pill -->
    <rect x="40" y="40" width="225" height="30" rx="6" fill="rgba(2,132,199,0.08)" stroke="#0284C7" stroke-opacity="0.35" />
    <text x="52" y="59" fill="#0284C7" font-family="monospace" font-size="11" font-weight="700" letter-spacing="1">High Jewelry · Atelier</text>

    <!-- Main Title -->
    <text x="40" y="145" fill="#0F172A" font-family="'Cinzel', serif, sans-serif" font-size="26" font-weight="700" letter-spacing="1">JADE International</text>
    
    <!-- Accent Bar -->
    <rect x="40" y="165" width="80" height="3" rx="1.5" fill="#0284C7" />

    <!-- Metric Tag -->
    <rect x="40" y="300" width="245" height="34" rx="8" fill="#FFFFFF" stroke="rgba(2,132,199,0.2)" />
    <circle cx="56" cy="317" r="4" fill="#0284C7" />
    <text x="70" y="321" fill="#334155" font-family="monospace" font-size="11" font-weight="600">GIA CERTIFIED · ATELIER</text>

    <!-- Geometric Accent Outline (Emerald Cut diamond facet shape) -->
    <circle cx="480" cy="200" r="100" fill="none" stroke="#0284C7" stroke-opacity="0.15" stroke-width="1.5" />
    <polygon points="480,120 535,160 535,240 480,280 425,240 425,160" fill="none" stroke="#0284C7" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4,4" />
    <circle cx="480" cy="200" r="28" fill="#0284C7" fill-opacity="0.08" />
  </svg>