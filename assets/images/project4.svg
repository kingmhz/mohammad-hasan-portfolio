<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1D" />
      <stop offset="60%" stop-color="#050811" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <radialGradient id="glow4" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" fill="url(#bg4)" />
  <rect width="600" height="380" fill="url(#glow4)" />

  <!-- Code/Matrix Grid Accents -->
  <g stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.5">
    <line x1="0" y1="95" x2="600" y2="95" />
    <line x1="0" y1="190" x2="600" y2="190" />
    <line x1="0" y1="285" x2="600" y2="285" />
  </g>

  <!-- Central AI Engineering Workstation Frame -->
  <g transform="translate(25, 20)">
    <!-- Terminal Outer Chassis -->
    <rect x="0" y="0" width="550" height="340" rx="14" fill="url(#termGrad)" stroke="#334155" stroke-width="1.2" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.7))" />
    
    <!-- Window Titlebar -->
    <rect x="0" y="0" width="550" height="36" rx="14" fill="#1E293B" fill-opacity="0.8" />
    <circle cx="20" cy="18" r="4.5" fill="#EF4444" opacity="0.9" />
    <circle cx="36" cy="18" r="4.5" fill="#F59E0B" opacity="0.9" />
    <circle cx="52" cy="18" r="4.5" fill="#10B981" opacity="0.9" />

    <text x="80" y="22" fill="#94A3B8" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">krypton-agent-core :: autonomous_orchestrator.py</text>
    
    <!-- Model Selector Badge -->
    <rect x="410" y="8" width="125" height="20" rx="10" fill="#312E81" stroke="#6366F1" stroke-width="0.8" />
    <circle cx="422" cy="18" r="3" fill="#818CF8" />
    <text x="430" y="22" fill="#E0E7FF" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700">Claude 3.5 Sonnet</text>

    <!-- Left Sub-Pane: Agent Execution Graph -->
    <g transform="translate(16, 50)">
      <rect x="0" y="0" width="160" height="270" rx="8" fill="#0B1120" stroke="#1E293B" stroke-width="1" />
      <text x="14" y="22" fill="#64748B" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="1">PIPELINE GRAPH</text>
      
      <!-- Step 1 -->
      <g transform="translate(14, 38)">
        <rect x="0" y="0" width="132" height="36" rx="6" fill="#1E293B" fill-opacity="0.6" stroke="#10B981" stroke-width="1" />
        <circle cx="14" cy="18" r="4" fill="#10B981" />
        <text x="26" y="16" fill="#F1F5F9" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700">1. Query Planner</text>
        <text x="26" y="28" fill="#34D399" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8">Decomposed (4 sub-tasks)</text>
      </g>

      <!-- Connector -->
      <line x1="80" y1="74" x2="80" y2="86" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="2,2" />

      <!-- Step 2 -->
      <g transform="translate(14, 88)">
        <rect x="0" y="0" width="132" height="36" rx="6" fill="#1E293B" fill-opacity="0.6" stroke="#6366F1" stroke-width="1" />
        <circle cx="14" cy="18" r="4" fill="#818CF8" />
        <text x="26" y="16" fill="#F1F5F9" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700">2. Vector Search</text>
        <text x="26" y="28" fill="#A5B4FC" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8">pgvector (cosine: 0.96)</text>
      </g>

      <!-- Connector -->
      <line x1="80" y1="124" x2="80" y2="136" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="2,2" />

      <!-- Step 3 -->
      <g transform="translate(14, 138)">
        <rect x="0" y="0" width="132" height="36" rx="6" fill="#1E293B" fill-opacity="0.6" stroke="#38BDF8" stroke-width="1" />
        <circle cx="14" cy="18" r="4" fill="#38BDF8" />
        <text x="26" y="16" fill="#F1F5F9" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700">3. Tool Execution</text>
        <text x="26" y="28" fill="#7DD3FC" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8">FastAPI Edge Sandbox</text>
      </g>

      <!-- Connector -->
      <line x1="80" y1="174" x2="80" y2="186" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="2,2" />

      <!-- Step 4 -->
      <g transform="translate(14, 188)">
        <rect x="0" y="0" width="132" height="36" rx="6" fill="#312E81" fill-opacity="0.4" stroke="#818CF8" stroke-width="1" />
        <circle cx="14" cy="18" r="4" fill="#C084FC" />
        <text x="26" y="16" fill="#F1F5F9" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700">4. Stream Output</text>
        <text x="26" y="28" fill="#E879F9" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8">SSE Chunk Stream</text>
      </g>

      <!-- System Health Indicator -->
      <rect x="14" y="236" width="132" height="22" rx="4" fill="#022C22" stroke="#059669" stroke-width="0.8" />
      <text x="24" y="251" fill="#34D399" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="8.5" font-weight="600">✓ ALL AGENTS ACTIVE</text>
    </g>

    <!-- Right Pane: Real-Time Token Streaming Console -->
    <g transform="translate(190, 50)">
      <rect x="0" y="0" width="344" height="270" rx="8" fill="#050811" stroke="#1E293B" stroke-width="1" />
      
      <!-- Top Stream Telemetry Stats -->
      <g transform="translate(14, 12)">
        <text x="0" y="12" fill="#38BDF8" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700">STREAM ACTIVE</text>
        <text x="100" y="12" fill="#94A3B8" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">Velocity: <tspan fill="#34D399" font-weight="700">142 tok/s</tspan></text>
        <text x="230" y="12" fill="#94A3B8" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">TTFT: <tspan fill="#F59E0B" font-weight="700">17.8 ms</tspan></text>
      </g>

      <line x1="14" y1="32" x2="330" y2="32" stroke="#1E293B" stroke-width="1" />

      <!-- Terminal Output Content -->
      <g transform="translate(14, 46)" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">
        <text x="0" y="12" fill="#64748B">> async def stream_reasoning_node(prompt, context):</text>
        <text x="0" y="28" fill="#818CF8">    embeddings = await pgvector.match(prompt.vector)</text>
        <text x="0" y="44" fill="#94A3B8">    plan = await agent.decompose(embeddings, threshold=0.92)</text>
        <text x="0" y="60" fill="#34D399">    # [FASTAPI EDGE DISPATCH: &lt;18ms latency]</text>
        <text x="0" y="76" fill="#F1F5F9">    async for chunk in model.generate_stream(plan):</text>
        <text x="0" y="92" fill="#F43F5E">        yield SSEPayload(chunk=chunk, delta_ms=3.2)</text>
        <text x="0" y="112" fill="#38BDF8">> Reasoning trace verified: Zero hallucinations detected.</text>
        
        <!-- Live Typing Cursor -->
        <rect x="0" y="124" width="8" height="13" fill="#38BDF8" opacity="0.9" />
        <text x="14" y="135" fill="#64748B">Streaming response to client web socket...</text>
      </g>

      <!-- Bottom Benchmark Banner inside Terminal -->
      <g transform="translate(14, 206)">
        <rect x="0" y="0" width="316" height="50" rx="6" fill="#0F172A" stroke="#334155" stroke-width="0.8" />
        <text x="12" y="18" fill="#94A3B8" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9">VECTOR ENGINE</text>
        <text x="12" y="36" fill="#F8FAFC" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">pgvector · 1.2M Index</text>

        <text x="165" y="18" fill="#94A3B8" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9">CACHE LAYER</text>
        <text x="165" y="36" fill="#38BDF8" font-family="'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">Redis In-Memory</text>
      </g>
    </g>
  </g>
</svg>